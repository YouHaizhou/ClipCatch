[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-ai-backend"
version = "1.0.0"
description = "VideoAI Backend - FastAPI"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy==2.0.30",
    "aiofiles==23.2.1",
    "httpx==0.27.0",
    "yt-dlp==2024.3.10",
    "websockets==12.0",
    "faster-whisper>=1.0.0",
    "cryptography==42.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]
